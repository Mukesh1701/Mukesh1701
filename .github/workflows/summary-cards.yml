name: Generate Profile Summary Cards

# Generates GitHub stat SVGs into this repo daily so the profile README
# never depends on rate-limited third-party services.

on:
  schedule:
    - cron: '0 0 * * *' # daily
  workflow_dispatch: # manual trigger from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: 'Mukesh1701'
          THEME: github_dark
